name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Test
        run: cargo test --release

      - name: Benchmark smoke run
        run: cargo run --release -- --nItems 200000 --nProducers 4 --nConsumers 4 --mode both

  loom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      RUSTFLAGS: --cfg loom
      LOOM_MAX_PREEMPTIONS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Model-check the lock-free queue
        run: cargo test --release --test loom
